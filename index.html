<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://widget.cdek.ru/widget/widjet.js" id="ISDEKscript"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f0f0f0; }
        #cdek_map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="cdek_map"></div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно в Telegram на максимум

        // Инициализация виджета без лишних путей (используем стандартные)
        const ourWidjet = new ISDEKWidjet({
            defaultCity: 'Москва',
            cityFrom: 'Москва', 
            country: 'Россия',
            link: 'cdek_map',
            onChoose: function(info) {
                // Формируем объект данных для отправки в ваш C# код
                const data = {
                    address: info.address,
                    code: info.id,
                    city: info.cityName
                };
                // Отправляем данные в бота и закрываем окно
                tg.sendData(JSON.stringify(data)); 
                tg.close();
            }
        });
    </script>
</body>
</html>
