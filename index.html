<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор ПВЗ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://widget.cdek.ru/widget/widjet.js" id="ISDEKscript"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #f4f4f4; }
        #cdek_map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="cdek_map"></div>
    <script type="text/javascript">
        window.onload = function() {
            // Проверка наличия Telegram SDK
            const tg = window.Telegram?.WebApp;
            if (tg) tg.expand();

            try {
                new ISDEKWidjet({
                    defaultCity: 'Москва',
                    cityFrom: 'Москва',
                    link: 'cdek_map',
                    onChoose: function(info) {
                        if (tg) {
                            tg.sendData(JSON.stringify({
                                address: info.address,
                                code: info.id,
                                city: info.cityName
                            }));
                            tg.close();
                        }
                    }
                });
            } catch (e) {
                console.error("Ошибка виджета:", e);
                document.body.innerHTML = "<h3 style='text-align:center; margin-top:50px;'>Ошибка загрузки карты СДЭК</h3>";
            }
        };
    </script>
</body>
</html>
